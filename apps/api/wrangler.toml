# Secrets are never written here. Set them with `wrangler secret put <NAME>` (see docs/setup/).
name = "papi-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_ENV = "production"

# One every-minute trigger runs the queue dispatcher and schedules maintenance (free plan: 5 per account).
[triggers]
crons = ["* * * * *"]
