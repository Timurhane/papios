name: Heavy jobs

# Kaşif/Analist heavy work (K-3.6): Playwright deep crawls, batch analysis, CSV/OSM/web-search imports.
# Runs every 6 hours, and immediately when the Worker dispatches it (optional GITHUB_DISPATCH_TOKEN).
# Budget (K-3.17): 4 scheduled runs/day × ~3 min ≈ 360 min/month + on-demand runs.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heavy-jobs
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
      PANEL_URL: ${{ vars.PANEL_URL }}
      IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      MAX_RUN_MINUTES: '15'
    steps:
      - name: Skip until configured
        id: cfg
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Supabase secrets not set yet; nothing to do."; echo "ready=false" >> "$GITHUB_OUTPUT"
          else echo "ready=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.cfg.outputs.ready == 'true'
        uses: actions/checkout@v5
      - if: steps.cfg.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.cfg.outputs.ready == 'true'
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.cfg.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.cfg.outputs.ready == 'true'
        run: pnpm --filter @papi/jobs exec playwright install --with-deps chromium
      - if: steps.cfg.outputs.ready == 'true'
        run: pnpm --filter @papi/jobs start
