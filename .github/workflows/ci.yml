name: CI

# Every push (any branch) runs CI once; PRs show the result through the commit status,
# so a separate pull_request trigger would only double the Actions minutes (K-17.8).
on:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @papi/web build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar xz -C /usr/local/bin gitleaks
      - run: gitleaks git --redact --no-banner --config .gitleaks.toml

  database:
    name: Database (migrations, seed, RLS tests, repo integration)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Database + API gateway + PostgREST only (auth is needed by the schema, not as a service).
      - run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: supabase test db
      - name: Repo integration tests (real PostgREST)
        run: |
          eval "$(supabase status -o json | node -e '
            let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
              const j=JSON.parse(s);
              const key=j.SERVICE_ROLE_KEY||j.SECRET_KEY;
              console.log(`export SUPABASE_IT_URL=${j.API_URL}`);
              console.log(`export SUPABASE_IT_SERVICE_KEY=${key}`);
            })')"
          test -n "$SUPABASE_IT_SERVICE_KEY"
          pnpm vitest run --project server src/repo/supabase.integration.test.ts

  e2e:
    name: Panel smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @papi/web exec playwright install --with-deps chromium
      - run: pnpm --filter @papi/web e2e
      - name: Deep-crawl renderer (real browser)
        run: RUN_BROWSER_TESTS=1 pnpm vitest run --project jobs src/render.test.ts
