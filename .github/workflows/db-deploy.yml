name: DB deploy

# Applies migrations (and the idempotent seed) to the live Supabase project.
# Manual only: run from the Actions tab after CI is green.
on:
  workflow_dispatch:
    inputs:
      include_seed:
        description: Also apply supabase/seed (idempotent; never overwrites existing values)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: db-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - run: supabase db push --password "$SUPABASE_DB_PASSWORD" ${{ inputs.include_seed && '--include-seed' || '' }}
