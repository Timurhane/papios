name: API deploy

# Deploys the Worker (API, Telegram webhook, cron), syncs its secrets from GitHub secrets and
# registers the Telegram webhook. Manual only: run from the Actions tab after CI is green.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Deploy Worker
        id: deploy
        working-directory: apps/api
        run: |
          out=$(pnpm exec wrangler deploy 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          url=$(echo "$out" | grep -oE 'https://[a-z0-9.-]+\.workers\.dev' | head -1)
          test -n "$url" || { echo "worker url not found"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Sync Worker secrets
        working-directory: apps/api
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_DISPATCH_TOKEN: ${{ secrets.GITHUB_DISPATCH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PANEL_URL: ${{ vars.PANEL_URL }}
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          PUBLIC_TOKEN_SECRET: ${{ secrets.PUBLIC_TOKEN_SECRET }}
        run: |
          umask 077
          node -e '
            const keys = ["SUPABASE_URL","SUPABASE_SERVICE_ROLE_KEY","TELEGRAM_BOT_TOKEN","TELEGRAM_WEBHOOK_SECRET","TELEGRAM_OWNER_ID","GEMINI_API_KEY","GROQ_API_KEY","PAGESPEED_API_KEY","IG_BUSINESS_ACCOUNT_ID","IG_ACCESS_TOKEN","GITHUB_DISPATCH_TOKEN","GITHUB_REPOSITORY","PANEL_URL","PUBLIC_API_URL","PUBLIC_TOKEN_SECRET"];
            const out = Object.fromEntries(keys.filter(k => process.env[k]).map(k => [k, process.env[k]]));
            console.error("syncing:", Object.keys(out).join(", "));
            require("fs").writeFileSync(process.env.RUNNER_TEMP + "/worker-secrets.json", JSON.stringify(out));
          '
          pnpm exec wrangler secret bulk "$RUNNER_TEMP/worker-secrets.json"
          rm -f "$RUNNER_TEMP/worker-secrets.json"

      - name: Register Telegram webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          WORKER_URL: ${{ steps.deploy.outputs.url }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            -H 'content-type: application/json' \
            -d "{\"url\":\"${WORKER_URL}/telegram/webhook\",\"secret_token\":\"${TELEGRAM_WEBHOOK_SECRET}\",\"allowed_updates\":[\"message\",\"callback_query\"],\"drop_pending_updates\":true}" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);console.log("webhook:",r.ok,r.description||"");process.exit(r.ok?0:1)})'

      - name: Health check
        run: curl -sS "${{ steps.deploy.outputs.url }}/health"
